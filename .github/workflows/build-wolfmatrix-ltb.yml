name: WolfMatrix LTB EXE Build
on:
  workflow_dispatch:
  push:
    paths:
      - 'WolfMatrixLTB.csproj'
      - 'Program.cs'
      - '.github/workflows/build-wolfmatrix-ltb.yml'
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish standalone Windows EXE
        shell: pwsh
        run: dotnet publish WolfMatrixLTB.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: WolfMatrix_LTB_Kontrol_EXE
          path: publish/WolfMatrix_LTB_Kontrol.exe
